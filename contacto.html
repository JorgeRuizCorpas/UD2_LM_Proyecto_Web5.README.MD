<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Contacto - Selección Española de Fútbol</title>
</head>
<body>


  <header>
    <h1>Contacto</h1>
    <p>Ponte en contacto con nosotros para más información sobre la Selección Española de Fútbol.</p>
    <nav>
      <a href="index.html">Inicio</a> |
    </nav>
  </header>

  <main>
    <h2>Formulario de contacto</h2>
    <form action="#" method="post">
      <p>
        <label for="nombre">Nombre:</label><br>
        <input type="text" id="nombre">
      </p>
      <p>
        <label for="email">Correo electrónico:</label><br>
        <input type="email" id="email">
      </p>
      <p>
        <label for="mensaje">Mensaje:</label><br>
        <textarea id="mensaje"></textarea>
      </p>
      <p>
        <input type="submit" value="Enviar">
      </p>
    </form>

    <h2>Otras formas de contacto</h2>
    <p>Correo: contacto@seleccionespanola.es</p>
    <p>Teléfono: +34 600 123 456</p>
    <p>Dirección: Ciudad del Fútbol, Las Rozas (Madrid), España</p>
