<form>
  <label>Nombre:<br>
    <input type="text" name="nombre">
  </label><br>

  <label>Correo electrónico:<br>
    <input type="email" name="email">
  </label><br>

  <label>Fecha compra entradas<br>
    <input type="date" name="entrada">
  </label><br>

  <label>Adultos:<br>
    <input type="number" name="adultos" min="1" value="1">
  </label><br>

  <label>Niños:<br>
    <input type="number" name="ninos" min="0" value="0">
  </label><br>

  <label>Asientos<br>
    <select name="habitacion" required>
      <option value="">--Seleccione--</option>
      <option>Fondos norte/sur</option>
      <option>Preferencia</option>
      <option>Tribuna/Anfiteatro</option>
    </select>
  </label><br>
  <label>
    <input type="checkbox" name="cancelacion">
    Acepto la política de cancelación
  </label><br>

  <button type="submit">Confirmar Entrada</button>
  <button type="reset">Borrar</button><br><br><br>
